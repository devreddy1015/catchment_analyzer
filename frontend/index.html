<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catchment Analyzer</title>
    <meta name="description" content="Find the pond site and the land that drains to it, from a contour map or anywhere on the map." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💧</text></svg>" />
  </head>
  <body>
    <script>
      /* Set the theme before the first paint. React does this too, but it runs
         after mount, and a white flash on the way into dark mode is exactly the
         thing dark mode is for avoiding. Kept in sync with src/theme.ts. */
      (function () {
        try {
          var saved = localStorage.getItem('catchment-theme') || 'system';
          var dark = saved === 'dark' ||
            (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
